<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Window</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07080f; color: #e8ebff;
           font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
  </style>
</head>
<body>
  <main>
    <h1>3D Window: hosting test</h1>
    <p>GitHub Pages is serving this page.</p>
    <p id="proto"></p>
  </main>
  <script>
    document.getElementById('proto').textContent =
      'Protocol: ' + location.protocol + (window.isSecureContext ? ' (secure context: camera allowed)' : ' (not secure: camera blocked)');
  </script>
</body>
</html>
